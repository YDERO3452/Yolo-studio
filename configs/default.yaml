# YOLO Studio Default Configuration
# Field names match Ultralytics YOLO API exactly for direct passthrough.

app:
  name: "YOLO Studio"
  version: "1.0.0"
  theme: "dark"
  language: "zh"

training:
  # --- Core ---
  model: "yolov8n.pt"
  epochs: 100
  time: null            # max training hours (overrides epochs if set)
  batch: 16             # int or float 0.0-1.0 for AutoBatch
  imgsz: 640
  device: "0"           # GPU id, "cpu", or list like "0,1"
  workers: 8
  patience: 100         # early-stop patience (Ultralytics default=100)
  save: true
  save_period: -1       # checkpoint every N epochs; -1 = disabled
  cache: false          # true / "ram" / "disk"
  project: "runs/train"
  name: null
  exist_ok: false
  pretrained: true
  optimizer: "auto"     # auto, SGD, Adam, AdamW, NAdam, RAdam, RMSProp, MuSGD
  verbose: true
  seed: 0
  deterministic: true
  single_cls: false
  rect: false
  cos_lr: false
  close_mosaic: 10      # disable mosaic for final N epochs
  resume: false
  amp: true             # Automatic Mixed Precision
  fraction: 1.0
  profile: false
  freeze: null          # e.g. 10 or [0,1,2]
  multi_scale: 0.0

  # --- Segmentation ---
  overlap_mask: true
  mask_ratio: 4

  # --- Classification ---
  dropout: 0.0

  # --- Loss gains ---
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5
  cls: 0.5
  dfl: 1.5
  pose: 12.0            # pose task
  kobj: 1.0             # pose task
  nbs: 64               # nominal batch size for loss normalisation

  # --- Augmentation ---
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  bgr: 0.0
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  copy_paste_mode: "flip"
  auto_augment: "randaugment"
  erasing: 0.4

inference:
  conf: 0.25            # confidence threshold
  iou: 0.7              # NMS IoU threshold (Ultralytics default=0.7)
  max_det: 300
  classes: null          # filter by class id(s)
  agnostic_nms: false
  augment: false         # test-time augmentation
  show_labels: true
  show_conf: true
  show_boxes: true
  line_width: null       # null = auto-scale
  vid_stride: 1
  retina_masks: false

annotation:
  default_classes:
    - "目标"
  auto_save: true
  label_format: "yolo"  # yolo, coco, voc
  min_box_size: 10
  default_shape_type: "bbox"  # bbox, polygon, obb, keypoint
  num_keypoints: 17
  keypoint_names: []

export:
  format: "onnx"        # onnx, torchscript, engine, openvino, coreml, ...
  imgsz: 640
  half: false
  dynamic: false
  simplify: true
  opset: null            # null = use Ultralytics tested default
  int8: false
  workspace: null        # TensorRT workspace GiB
  nms: false             # fuse NMS into model
