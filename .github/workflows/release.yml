name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: YoloStudio.exe
          - os: ubuntu-latest
            artifact: YoloStudio

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libxkbcommon0 libegl1 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics onnx onnxruntime openai Pillow PyQt6 PyQt6-Qt6 opencv-python albumentations matplotlib pyyaml pydantic pandas loguru tqdm numpy

      - name: Download font (optional)
        continue-on-error: true
        run: python scripts/download_font.py

      - name: Build executable
        run: pyinstaller --onefile --noconfirm --name YoloStudio main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "YOLO Studio ${{ github.ref_name }}"
          body: |
            ## YOLO Studio ${{ github.ref_name }}

            ### 下载
            - **Windows**: `YoloStudio.exe`
            - **Linux**: `YoloStudio`

            ### 使用说明
            1. 下载对应平台的可执行文件
            2. 首次运行会自动下载 YOLO 模型
            3. 如需 GPU 加速，请确保已安装 CUDA 和对应的 PyTorch

            ### 更新内容
            <!-- 请在此处添加更新日志 -->
          files: |
            artifacts/YoloStudio.exe
            artifacts/YoloStudio
          draft: false
          prerelease: false
