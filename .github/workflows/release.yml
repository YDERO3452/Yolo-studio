name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: YoloStudio.exe
          - os: ubuntu-latest
            artifact: YoloStudio

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libxkbcommon0 libegl1 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Build with CPU-only torch to keep exe size manageable (~350 MB vs ~2.5 GB).
          # The app's built-in env check dialog guides users to install
          # CUDA torch if they have an NVIDIA GPU.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Download font (optional)
        continue-on-error: true
        run: python scripts/download_font.py

      - name: Build executable
        run: pyinstaller YoloStudio.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Generate changelog
        id: changelog
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          # 写入多行 output
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "YOLO Studio ${{ github.ref_name }}"
          body: |
            ## YOLO Studio ${{ github.ref_name }}

            ### 下载
            | 平台 | 文件 |
            |------|------|
            | Windows | `YoloStudio.exe` |
            | Linux | `YoloStudio` |

            ### 使用说明

            **Windows**: 下载 `YoloStudio.exe`，双击运行

            **Linux**:
            ```bash
            chmod +x YoloStudio
            ./YoloStudio
            ```

            ### GPU 加速 (NVIDIA 显卡)

            打包版本默认使用 CPU 模式。如需 GPU 加速，请在应用内操作：

            1. 打开应用 → 画布左上角 **⋯** → **工具** → **环境**（或双击「系统 / 环境」节点）→ 自动检测 GPU 和驱动
            2. 点击 **安装 PyTorch (cu121)** 按钮一键安装 CUDA 版 PyTorch
            3. 或手动执行：
               ```
               pip install torch torchvision --force-reinstall --index-url https://download.pytorch.org/whl/cu121
               ```

            驱动要求：NVIDIA 驱动 >= 525.60（CUDA 12.0+）
            查看驱动支持的 CUDA 版本：`nvidia-smi`

            ### 从源码安装

            ```bash
            # 1. 配置国内镜像源（可选，加速下载）
            pip config set global.index-url https://mirrors.aliyun.com/pypi/simple

            # 2a. CPU 模式
            pip install -r requirements.txt

            # 2b. NVIDIA GPU 模式 (CUDA 12.1)
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
            pip install -r requirements.txt
            ```

            或使用一键安装脚本：
            - Windows: `scripts\install.bat`
            - Linux/macOS: `bash scripts/install.sh`

            ### 更新内容
            ${{ steps.changelog.outputs.changes }}
          files: |
            artifacts/YoloStudio.exe
            artifacts/YoloStudio
          draft: false
          prerelease: false
