name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: YoloStudio.exe
          - os: ubuntu-latest
            artifact: YoloStudio

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libxkbcommon0 libegl1 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics onnx onnxruntime openai Pillow PyQt6 PyQt6-Qt6 opencv-python albumentations matplotlib pyyaml pydantic pandas loguru tqdm numpy

      - name: Download font (optional)
        continue-on-error: true
        run: python scripts/download_font.py

      - name: Build executable
        run: pyinstaller --onefile --noconfirm --name YoloStudio main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Generate changelog
        id: changelog
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          # 写入多行 output
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "YOLO Studio ${{ github.ref_name }}"
          body: |
            ## YOLO Studio ${{ github.ref_name }}

            ### 下载
            | 平台 | 文件 |
            |------|------|
            | Windows | `YoloStudio.exe` (346 MB) |
            | Linux | `YoloStudio` (496 MB) |

            ### 使用说明
            **Windows**: 下载 `YoloStudio.exe`，双击运行

            **Linux**:
            ```bash
            chmod +x YoloStudio
            ./YoloStudio
            ```

            首次运行会自动下载 YOLO 模型，如需 GPU 加速请安装 [CUDA + PyTorch](https://pytorch.org/get-started/locally/)

            ### 更新内容
            ${{ steps.changelog.outputs.changes }}
          files: |
            artifacts/YoloStudio.exe
            artifacts/YoloStudio
          draft: false
          prerelease: false
