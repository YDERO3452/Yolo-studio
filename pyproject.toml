[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "yolo-studio"
version = "1.0.0"
description = "基于 PyQt6 的 YOLO 目标检测标注与训练桌面应用"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
authors = [
  {name = "YDERO3452"},
]
keywords = ["yolo", "object-detection", "annotation", "training", "pyqt6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "ultralytics>=8.2.0",
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "onnx>=1.16.0",
  "onnxruntime>=1.18.0",
  "openai>=1.40.0",
  "Pillow>=10.0.0",
  "PyQt6>=6.6.0",
  "PyQt6-Qt6>=6.6.0",
  "opencv-python>=4.8.0",
  "albumentations>=1.3.0",
  "matplotlib>=3.7.0",
  "pyyaml>=6.0",
  "pydantic>=2.0.0",
  "pandas>=2.0.0",
  "loguru>=0.7.0",
  "tqdm>=4.66.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "pytest-cov>=4.1",
  "ruff>=0.4.0",
]

[project.scripts]
yolo-studio = "main:main"

[project.urls]
Homepage = "https://github.com/YDERO3452/Yolo-studio"
Repository = "https://github.com/YDERO3452/Yolo-studio"
Issues = "https://github.com/YDERO3452/Yolo-studio/issues"

[tool.setuptools.packages.find]
include = ["core*", "gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter

[tool.coverage.run]
source = ["core", "gui"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
